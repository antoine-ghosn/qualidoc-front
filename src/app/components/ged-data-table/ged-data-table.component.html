<div class="table-responsive ged-table">
  <table mat-table [dataSource]="data" class="w-100">
    @for (column of columns; track column) {
    <ng-container [matColumnDef]="column.name">
      <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">
        {{ getColumnHeader(column) }}
      </th>
      <td mat-cell *matCellDef="let element" (click)="onItemClick('SHOW',element)" >
        {{ getColumnValue(element, column.name) }}
      </td>
    </ng-container>
    }

    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">{{ lang.t('ged.action') }}</th>
      <td mat-cell *matCellDef="let element" class="action-link">
        <a class="cursor-pointer" (click)="onItemClick('EDIT', element)">
          <i-tabler name="edit" class="icon-18"></i-tabler>
        </a>
        <a class="cursor-pointer" (click)="onItemClick('DOWNLOAD', element)">
          <i-tabler name="download" class="icon-18"></i-tabler>
        </a>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
  ></mat-paginator>
</div>
