<mat-card class="cardWithShadow">
  <div class="p-24">
    <mat-card-title class="m-b-0">Configuration FTP </mat-card-title>
  </div>

  <mat-card-content>
    <form [formGroup]="ftpForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-sm-4">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Nom</mat-label>
            <input matInput formControlName="name" placeholder="Nom" required />
          </mat-form-field>

          <mat-error
            *ngIf="
              ftpForm.get('name')?.dirty &&
              ftpForm.get('name')?.hasError('required')
            "
          >
            Champ requis
          </mat-error>
        </div>

        <div class="col-sm-4">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Address IP</mat-label>

            <input
              matInput
              formControlName="ip"
              placeholder="127.0.0.1"
              required
            />
            <mat-error
              *ngIf="
                ftpForm.get('ip')?.dirty &&
                ftpForm.get('ip')?.hasError('required')
              "
            >
              Champ requis
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-sm-2">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Port</mat-label>

            <input
              matInput
              formControlName="port"
              placeholder="8888"
              required
            />
            <mat-error
              *ngIf="
                ftpForm.get('port')?.dirty &&
                ftpForm.get('port')?.hasError('required')
              "
            >
              Champ requis
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-sm-4">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label> Nom d'utilisateur</mat-label>

            <input
              matInput
              type="text"
              formControlName="username"
              placeholder="nom d'utilisateur"
              required
            />
            <mat-error
              *ngIf="
                ftpForm.get('username')?.dirty &&
                ftpForm.get('username')?.hasError('required')
              "
            >
              Champ requis
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-sm-4">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Mot de passe</mat-label>

            <input
              matInput
              type="password"
              formControlName="password"
              placeholder="Mot de passe"
              required
            />
            <mat-error
              *ngIf="
                ftpForm.get('password')?.dirty &&
                ftpForm.get('password')?.hasError('required')
              "
            >
              Champ requis
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-sm-4">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Confirmation</mat-label>

            <input
              matInput
              type="password"
              formControlName="confirmPassword"
              placeholder="Confirmation"
              required
            />
            <mat-error
              *ngIf="
                ftpForm.get('confirmPassword')?.dirty &&
                ftpForm.get('confirmPassword')?.hasError('required')
              "
            >
              Champ requis
            </mat-error>
            <mat-error *ngIf="ftpForm.hasError('passwordMismatch')">
              Les mots de passe ne correspondent pas
            </mat-error>
          </mat-form-field>
        </div>

        <div class="col-sm-2">
          <div class="d-flex align-items-center justify-content-center gap-8">
            <button
              mat-flat-button
              color="primary"
              type="submit"
              [disabled]="ftpForm.invalid"
            >
              {{ isEdit ? "Modifier" : "Ajouter" }}
            </button>
            <ng-container *ngIf="isEdit">
              <button
                mat-flat-button
                class="bg-error text-white"
                type="button"
                (click)="onCancel()"
              >
                Annuler
              </button>
            </ng-container>
          </div>
        </div>
      </div>
    </form>
  </mat-card-content>
</mat-card>
