
<app-form  [serverSetting]="serverSetting" [flow]="flow"></app-form>

<mat-card class="cardWithShadow">
  <mat-card-content>
    <mat-form-field appearance="outline" class="w-100">
      <input
        matInput
        placeholder="Recherche"
        (keyup)="applyFilter($any($event.target).value)"
      />
    </mat-form-field>

    <div class="table-responsive">
       <table mat-table [dataSource]="dataSource" class="w-100">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">Nom</th>
          <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>

        <ng-container matColumnDef="base_directory">
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">Dossier</th>
          <td mat-cell *matCellDef="let element">{{ element.base_directory }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600">
            Action
          </th>
          <td mat-cell *matCellDef="let element" class="action-link">
            <a
              (click)="onItemClick('EDIT', element)"
              class="m-r-20 cursor-pointer"
            >
              <i-tabler name="edit" class="icon-20"></i-tabler>
            </a>
            <a
              (click)="onItemClick('DELETE', element)"
              class="m-r-20 cursor-pointer"
            >
              <i-tabler name="trash" class="icon-20"></i-tabler>
            </a>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
      <mat-paginator
        [pageSizeOptions]="[5, 10, 20]"
        showFirstLastButtons
      ></mat-paginator>

     </div>
  </mat-card-content>
</mat-card>
