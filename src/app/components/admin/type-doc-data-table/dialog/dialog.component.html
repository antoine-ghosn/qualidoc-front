<h2 class="f-w-500" mat-dialog-title>{{ action }}</h2>
<mat-dialog-content>
  <div class="p-x-24">
    <p>{{ msg }}</p>
  </div>
  <div mat-dialog-actions class="p-x-24 p-b-24">
    <button
      mat-flat-button
      class="m-l-8 bg-primary text-white"
      (click)="doAction()"
    >
      CONFIRME
    </button>
    <button
      mat-button
      class="bg-light-error text-error m-l-8"
      (click)="closeDialog()"
    >
      ANNULÉ
    </button>
  </div>
</mat-dialog-content>
